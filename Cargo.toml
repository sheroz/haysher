[package]
name = "haysher"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Bitcoin mining pool software: solo, pooled, and hybrid pools side by side, over Stratum V1 and V2"
repository = "https://github.com/sheroz/haysher"
homepage = "https://haysher.com"
readme = "README.md"
keywords = ["bitcoin", "mining", "pool", "stratum", "sv2"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
publish = false

[workspace]
members = ["sv2-testclient"]
resolver = "3"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
regex = "1"
rust-embed = "8.12"
thiserror = "2.0"
toml = "1.1"

tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

rusqlite = { version = "0.42", features = ["bundled"] }

metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
maxminddb = "0.33"

bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

# stratum-core 0.7's SV2 crates, pinned exactly: their API moves between majors.
binary_sv2 = "=8.0.0"
codec_sv2 = { version = "=8.1.0", features = ["noise_sv2"] }
common_messages_sv2 = "=10.0.0"
framing_sv2 = "=9.0.0"
mining_sv2 = "=13.0.0"
noise_sv2 = "=2.1.0"
parsers_sv2 = "=0.7.0"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.53", features = ["test-util"] }

[lints.clippy]
enum_glob_use = "warn"
wildcard_imports = "warn"
